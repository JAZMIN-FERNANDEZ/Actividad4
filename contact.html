<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Contacto de Jazmín Fernández López" />
        <meta name="author" content="Jazmín Fernández López" />
        <title>Contacto | Jazmín</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Bootstrap CSS (before your CSS)-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/portafolio.css" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column">
        <main class="flex-shrink-0">
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
                <div class="container px-5">
                    <a class="navbar-brand" href="index.html"><span class="fw-bolder text-primary">Jazmín Fernández</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Mostrar menú"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="resume.html">Currículum</a></li>
                            <li class="nav-item"><a class="nav-link" href="projects.html">Proyectos</a></li>
                            <li class="nav-item"><a class="nav-link" href="contact.html">Contacto</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Page content-->
            <section class="py-5">
                <div class="container px-5">
                    <!-- Contact form-->
                    <div class="bg-light rounded-4 py-5 px-4 px-md-5">
                        <div class="text-center mb-5">
                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i class="bi bi-envelope"></i></div>
                            <h1 class="fw-bolder">Contáctame</h1>
                            <p class="lead fw-normal text-muted mb-0">¡Trabajemos juntos!</p>
                        </div>

                        <!-- Contact info-->
                        <div class="row gx-5 justify-content-center mb-5 text-center">
                            <div class="col-lg-8 col-xl-6">
                                <div class="row row-cols-1 row-cols-md-3 gy-3">
                                    <div class="col">
                                        <div class="bg-white rounded-4 shadow-sm p-3 h-100">
                                            <div class="fs-3 text-primary"><i class="bi bi-person"></i></div>
                                            <div class="small text-muted">Nombre</div>
                                            <div class="fw-bolder">JAZMIN FERNANDEZ LOPEZ</div>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <div class="bg-white rounded-4 shadow-sm p-3 h-100">
                                            <div class="fs-3 text-primary"><i class="bi bi-telephone"></i></div>
                                            <div class="small text-muted">Teléfono</div>
                                            <a class="fw-bolder text-decoration-none" href="tel:+529513966011">951 396 6011</a>
                                        </div>
                                    </div>
                                    <div class="col">
                                        <div class="bg-white rounded-4 shadow-sm p-3 h-100">
                                            <div class="fs-3 text-primary"><i class="bi bi-envelope-at"></i></div>
                                            <div class="small text-muted">Correo</div>
                                            <a class="fw-bolder text-decoration-none" style="word-break: break-all;" href="mailto:22161057@itoaxaca.edu.mx">22161057@itoaxaca.edu.mx</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row gx-5 justify-content-center">
                            <div class="col-lg-8 col-xl-6">
                                <!-- Form: opens the visitor's email app with the message ready-->
                                <form id="contactForm">
                                    <!-- Name-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="name" type="text" placeholder="Escribe tu nombre..." required />
                                        <label for="name">Nombre completo</label>
                                    </div>
                                    <!-- Email-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="email" type="email" placeholder="nombre@ejemplo.com" required />
                                        <label for="email">Correo electrónico</label>
                                    </div>
                                    <!-- Phone-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="phone" type="tel" placeholder="(123) 456-7890" required />
                                        <label for="phone">Número de teléfono</label>
                                    </div>
                                    <!-- Message-->
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" id="message" placeholder="Escribe tu mensaje aquí..." style="height: 10rem" required></textarea>
                                        <label for="message">Mensaje</label>
                                    </div>
                                    <!-- Button-->
                                    <div class="d-grid"><button class="btn btn-primary btn-lg" id="submitButton" type="submit">Enviar</button></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer-->
        <footer class="bg-white py-4 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                    <div class="col-auto"><div class="small m-0">Copyright &copy; Jazmín Fernández López <span id="anio"></span></div></div>
                    <div class="col-auto">
                        <a class="small" href="contact.html">Contacto</a>
                    </div>
                </div>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/portafolio.js"></script>
        <script>
            document.getElementById("anio").textContent = new Date().getFullYear();

            // On submit, open the visitor's email app with the message ready to send to Jazmín
            document.getElementById("contactForm").addEventListener("submit", function (e) {
                e.preventDefault();
                var nombre = document.getElementById("name").value;
                var correo = document.getElementById("email").value;
                var telefono = document.getElementById("phone").value;
                var mensaje = document.getElementById("message").value;
                var cuerpo = "Nombre: " + nombre + "\nCorreo: " + correo + "\nTeléfono: " + telefono + "\n\n" + mensaje;
                window.location.href = "mailto:22161057@itoaxaca.edu.mx?subject=" +
                    encodeURIComponent("Contacto desde tu portafolio - " + nombre) +
                    "&body=" + encodeURIComponent(cuerpo);
            });
        </script>
    </body>
</html>
